
name: intly
description: Intly - a simple, fast social app (Flutter + C++ + Python + Supabase).
publish_to: none
version: 1.3.2+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  lucide_icons_flutter: ^3.0.0
  photo_manager: ^3.6.0
  video_player: ^2.9.2
  emoji_picker_flutter: ^4.0.0
  camera: ^0.11.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  ffi: ^2.1.0
  shared_preferences: ^2.2.3

flutter:
  uses-material-design: true
