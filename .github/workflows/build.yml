name: Build Intly (arm64 APK)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-stable
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Python - generate seed data
        run: python3 tools/gen_seed.py

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.intly --project-name intly .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Intly"/' android/app/src/main/AndroidManifest.xml
          # internet (Supabase login and sync; release builds do not include it by default)
          # + photo access for the custom media picker
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml
          # camera plugin needs minSdk 24
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          grep -n "minSdk" android/app/build.gradle* || true

      - name: C++ - build native core (arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          "$CXX" -std=c++17 -O3 -fPIC -shared -static-libstdc++ -fvisibility=hidden \
            -Wl,--gc-sections -Wl,-z,max-page-size=16384 -s \
            native/intly_native.cpp -o android/app/src/main/jniLibs/arm64-v8a/libintly_native.so
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: Flutter pub get
        run: flutter pub get

      - name: Check Supabase secret (length only)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "SUPABASE_PUBLISHABLE_KEY length: ${#SUPABASE_ANON_KEY} (0 means the secret is missing)"

      - name: Build arm64 release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          cp build/app/outputs/flutter-apk/app-release.apk Intly-arm64.apk
          ls -lh Intly-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Intly-arm64-apk
          path: Intly-arm64.apk
          retention-days: 14
